name: Retry Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Dependabot auto-merge
    types:
      - completed

permissions:
  actions: write
  pull-requests: read

jobs:
  retry:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Retry
        uses: ./retry-auto-merge
        with:
          min-delay: 10
          max-delay: 20
