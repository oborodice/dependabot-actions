pre-commit:
  commands:
    action-validator:
      glob: "*/action.yml"
      run: action-validator {staged_files}
    shellcheck:
      glob:
        - "*.{sh,bash}"
        - "test/bin/*"
      run: shellcheck {staged_files}
    bats:
      glob:
        - "*.{sh,bash,bats}"
        - "test/bin/*"
      run: bats test
